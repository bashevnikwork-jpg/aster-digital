name: Sync content from Google Drive

# Pulls the SkyBreeze Google Sheet into content/*.json, rebuilds the static
# pages, and commits any change back to main — so the live site follows the
# Sheet without anyone touching code. Runs once a day and on demand.
# Setup (service account + secrets): see CONTENT-EDITING.md.

on:
  schedule:
    - cron: "0 5 * * *"        # every day at 05:00 UTC (~08:00 Kyiv)
  workflow_dispatch:            # "Run workflow" button for an immediate sync

permissions:
  contents: write               # allow the job to commit the rebuilt site

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: pip install -r requirements-sync.txt

      - name: Pull content from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SKYBREEZE_SHEET_ID: ${{ secrets.SKYBREEZE_SHEET_ID }}
        run: python sync_drive.py

      - name: Rebuild the static pages
        run: |
          python parts.py
          python build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "skybreeze-content-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Content: sync from Google Drive [skip ci]"
            git push
            echo "Pushed content update."
          else
            echo "No changes — site already up to date."
          fi
